<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tab で背面に抜けるモーダル</title>
<style>
  body { font-family: sans-serif; }
  .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: none; align-items: center; justify-content: center; }
  .backdrop.open { display: flex; }
  .modal { background: #fff; padding: 16px; min-width: 280px; }
</style>
</head>
<body>
<main>
  <h1>Tab で背面に抜けるモーダル</h1>
  <p>最後のボタンで Tab を押すと、背面のリンクにフォーカスが移る。</p>
  <button id="open" type="button">予約する</button>
  <a href="#after">背面のリンク</a>
</main>
<div class="backdrop" id="backdrop">
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">予約日を選ぶ</h2>
    <label>日付 <input type="date"></label>
    <button type="button" id="cancel">キャンセル</button>
    <button type="button" id="submit">予約する</button>
  </div>
</div>
<script>
  // どの例も「正常なモーダル」と同じ実装で、BROKEN に挙げた 1 か所だけを壊している
  const BROKEN = "tab-escapes";
  const backdrop = document.getElementById("backdrop");
  const modal = document.getElementById("modal");
  let opener = null;
  function open() {
    opener = document.activeElement;
    backdrop.classList.add("open");
    if (BROKEN !== "focus-stays") modal.querySelector("input").focus();
  }
  function close() {
    backdrop.classList.remove("open");
    if (BROKEN !== "no-return") opener?.focus();
  }
  document.getElementById("open").addEventListener("click", open);
  document.getElementById("cancel").addEventListener("click", close);
  document.getElementById("submit").addEventListener("click", close);
  modal.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && BROKEN !== "no-escape") return close();
    if (e.key !== "Tab" || BROKEN === "tab-escapes") return;
    const f = [...modal.querySelectorAll("input, button")];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
</script>
</body>
</html>
