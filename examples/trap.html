<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>トラップ</title></head>
<body><main><h1>キーボードトラップの例</h1>
<a href="#x">リンク</a>
<input id="trap" aria-label="抜けられない入力欄">
<script>document.getElementById("trap").addEventListener("keydown", e => { if (e.key === "Tab") e.preventDefault(); });</script>
<a href="#y">ここには届かない</a></main></body></html>
